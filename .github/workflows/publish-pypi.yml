name: Publish to PyPI

# Tag-triggered release: build the wheel/sdist and publish via PyPI Trusted
# Publishing (OIDC -- no long-lived API token stored as a secret).
#
# REQUIRES a one-time manual step on pypi.org: add a Trusted Publisher for this
# exact repo + workflow filename (PyPI project settings > Publishing). Until
# that's configured, the publish step will fail with an authentication error.
#
# NOTE on versions: algosystem is ALREADY on PyPI (currently at 0.1.9, 10
# releases), published manually up to now -- but pyproject.toml on main here
# still says version = "0.1.7". Bump [tool.poetry].version to something newer
# than the latest published release BEFORE pushing a matching tag, or the
# publish step will fail (PyPI rejects re-uploading an existing version).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Build wheel and sdist
        run: poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/algosystem
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
