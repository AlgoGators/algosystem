name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run python -m pytest tests/ -q

      - name: Check formatting
        run: |
          poetry run python -m black --check algosystem tests
          poetry run python -m isort --check-only algosystem tests

      - name: Run Ruff
        run: poetry run python -m ruff check algosystem tests

      - name: Lint imports
        run: poetry run lint-imports

      - name: Test CLI help
        run: |
          poetry run algosystem --help
          poetry run algosystem backtest --help
          poetry run algosystem tearsheet --help
          poetry run algosystem benchmarks --help
          poetry run algosystem db --help
          poetry run algosystem db save --help
          poetry run algosystem db list --help
          poetry run algosystem db show --help
          poetry run algosystem db compare --help
          poetry run algosystem db delete --help
          poetry run algosystem db init --help
