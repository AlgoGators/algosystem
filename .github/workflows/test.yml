name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run python -m pytest tests/ -q

      - name: Check formatting
        run: |
          poetry run python -m black --check algosystem tests
          poetry run python -m isort --check-only algosystem tests

      - name: Run Ruff
        run: poetry run python -m ruff check algosystem tests

      - name: Lint imports
        run: poetry run lint-imports

      - name: Test CLI help
        run: |
          poetry run algosystem --help
          poetry run algosystem backtest --help
          poetry run algosystem tearsheet --help
          poetry run algosystem benchmarks --help
          poetry run algosystem db --help
          poetry run algosystem db save --help
          poetry run algosystem db list --help
          poetry run algosystem db show --help
          poetry run algosystem db compare --help
          poetry run algosystem db delete --help
          poetry run algosystem db init --help
