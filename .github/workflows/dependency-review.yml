name: Dependency Review

# Blocks a PR at review time if it introduces a known-vulnerable or
# license-incompatible dependency. Only evaluates the PR's diff against
# dependency manifests, so it is safe to make blocking from day one -- it never
# retroactively fails on what's already in the repo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
