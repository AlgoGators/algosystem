[tool.poetry]
name = "algosystem"
version = "0.1.9"
description = "A batteries-included pythonic library for AlgoGators members"
authors = ["AlgoGators Team <team@algogators.org>"]
homepage = "https://github.com/algogators/algosystem"
readme = "README.md"
# Optional classifiers (will be included in the built package)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "algosystem" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = ">=1.3.0"
numpy = ">=1.20.0"
matplotlib = ">=3.4.0"
seaborn = ">=0.11.0"
sqlalchemy = ">=1.4.0"
click = ">=8.0.0"
scipy = ">=1.7.0"
requests = ">=2.33.0"
quantstats = "^0.0.64"
# quantstats <0.0.66 imports IPython at module scope without declaring it, so
# it must be declared here. Capped below 9 because IPython 9.x requires Python
# >=3.11 and this package still supports 3.10.
ipython = ">=8.18.1,<9"
pyarrow = ">=23.0.1"
rich = "^14.0.0"
openpyxl = "^3.1.5"
yfinance = "^0.2.61"
python-dotenv = ">=1.2.2"
psycopg2 = "^2.9.10"
# Declared for security floors only; these are transitive at runtime.
pillow = ">=12.3.0"
urllib3 = ">=2.7.0"

[tool.poetry.scripts]
algosystem = "algosystem.interfaces.cli.main:cli"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pylint = "^3.1.0"
black = ">=26.3.1"
isort = "^5.13.2"
mypy = "^1.8.0"
pytest-cov = "^5.0.0"
backoff = "^1.2.1"
ruff = "^0.11.10"
import-linter = "^2.3.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.3.7"
sphinx-rtd-theme = "^2.0.0"
sphinx-copybutton = "^0.5.2"
myst-parser = "^3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
exclude = ["build/", "dist/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# The report is one embedded HTML/CSS/JS template. Wrapping markup at 100
# columns would obscure it without making it more readable.
"algosystem/validation/infrastructure/html_report.py" = ["E501"]
# Numeric kernels: the branching is the strategy logic, and splitting these
# into helpers would spread a single calculation across several functions.
"algosystem/validation/infrastructure/strategies/_cost_wrapper.py" = ["C901"]
"algosystem/validation/infrastructure/strategies/mean_reversion.py" = ["C901"]
"tests/validation/application/test_bruteforce.py" = ["C901"]
